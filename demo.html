<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reusable Pricing Card Component</title>
    <link rel="stylesheet" href="pricing-card.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        
        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        
        .header p {
            margin: 10px 0 0;
            font-size: 1.2em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Pricing Plans</h1>
        <p>Choose the perfect plan for your needs</p>
    </header>

    <div class="pricing-container" id="pricing-container">
        <!-- Cards will be generated here by JavaScript -->
    </div>

    <script src="pricing-card.js"></script>
    <script>
        // Configuration for multiple pricing cards
        const pricingPlans = [
            {
                title: 'Basic Plan',
                price: '$9.99',
                period: '/month',
                features: [
                    '1 GB Storage',
                    'Basic Support',
                    'All Core Features',
                    'Mobile App Access'
                ],
                buttonText: 'Start Trial',
                buttonAction: () => {
                    alert('Starting Basic Plan trial!');
                }
            },
            {
                title: 'Pro Plan',
                price: '$19.99',
                period: '/month',
                features: [
                    '10 GB Storage',
                    'Priority Support',
                    'Advanced Features',
                    'Mobile App Access',
                    'API Access',
                    'Custom Integrations'
                ],
                buttonText: 'Choose Pro',
                buttonAction: () => {
                    alert('Selecting Pro Plan!');
                }
            },
            {
                title: 'Enterprise',
                price: '$49.99',
                period: '/month',
                features: [
                    'Unlimited Storage',
                    '24/7 Premium Support',
                    'All Features',
                    'Mobile App Access',
                    'Full API Access',
                    'Custom Integrations',
                    'Dedicated Account Manager',
                    'Custom Branding'
                ],
                buttonText: 'Contact Sales',
                buttonAction: () => {
                    alert('Contacting Enterprise Sales!');
                }
            }
        ];

        // Generate the pricing cards
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('pricing-container');
            createPricingCards(pricingPlans, container);
        });
    </script>
</body>
</html>
